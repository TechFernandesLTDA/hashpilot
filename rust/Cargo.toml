[workspace]
resolver = "3"
members = ["hashpilot-core", "hashpilot-cli"]
# O minerador depende do zk-pow oficial (git) e é compilado à parte; ver hashpilot-miner/README.md.
exclude = ["hashpilot-miner"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/TechFernandesLTDA/hashpilot"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
