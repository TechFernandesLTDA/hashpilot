# Tipagem gradual: só os módulos listados são conferidos em modo estrito.
# Uso: mypy (sem argumentos, na raiz). Ferramenta de desenvolvimento opcional;
# o aplicativo continua só com a biblioteca padrão.
[mypy]
python_version = 3.14
files = data_contracts.py, config.py, fsutil.py, nvidia_smi.py, app_logging.py, miner_log.py, reference_profile.py, rig_config.py, valuation.py, payout.py, thermal.py
strict = True
warn_unused_ignores = True
follow_imports = silent

[mypy-contribution,gpu_profiles,gpu_agent,gpu_telemetry]
ignore_errors = True
